version: '3.9'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hu-erp-backend
    env_file:
      - ./Backend/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: hu-erp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

# Both containers share the default bridge network provided by Docker Compose
