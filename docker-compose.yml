version: '3.9'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hu-erp-backend
    env_file:
      - ./Backend/.env
    environment:
      # Override the PYTHON_BIN from .env so Docker always uses the venv Python
      # that has opencv-python-headless installed (set in the Dockerfile).
      - PYTHON_BIN=/opt/face-verify-venv/bin/python3
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: hu-erp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

# Both containers share the default bridge network provided by Docker Compose
